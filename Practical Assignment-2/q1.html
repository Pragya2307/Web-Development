<!DOCTYPE html>
<html>
<head>
  <title>Box Model & Inline-Block Demo</title>
  <style>
    
    .box {
      width: 150px;              
      padding: 20px;             
      border: 5px solid black;  
      margin: 15px;              
      background-color: lightyellow;
    }

    
    .item {
      display: inline-block;     
      width: 100px;
      height: 60px;
      margin: 10px;
      background-color: lightblue;
      text-align: center;
      line-height: 60px;
      border: 2px solid blue;
    }
  </style>
</head>

<body>

  <h2>Box Model Example</h2>
  <div class="box">Hello Box Model</div>

  <h2>Inline-Block Example</h2>
  <div class="item">One</div>
  <div class="item">Two</div>
  <div class="item">Three</div>

</body>
</html>
