<!DOCTYPE html>
<html>
<head>
    <title>Template Literals</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            text-align: center;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div class="box" id="output"></div>

<script>
    const msg = `Hello World
Welcome to JavaScript
Have a nice day`;

    document.getElementById("output").innerText = msg;
</script>

</body>
</html>
