!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <script>
       


<p id="para">This is the original text> </p>

<button id="btn">Click Me</button>


    document.getElementById("btn").addEventListener("click", function () {
        document.getElementById("para").textContent = "The text has been changed!";
    });
</script>

</body>
</html>
