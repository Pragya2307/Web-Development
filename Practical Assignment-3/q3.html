<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sum of Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        p {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <h3>Sum of Array</h3>

    <input type="text" id="arrayInput" placeholder="Enter numbers (e.g. 1,2,3,4)">
    <button onclick="calculateSum()">Find Sum</button>

    <p id="result"></p>
</div>

<script>
    function calculateSum() {
        let input = document.getElementById("arrayInput").value;

        let arr = input.split(",").map(Number);

        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
            sum += arr[i];
        }

        document.getElementById("result").innerHTML =
            "Sum of Array: " + sum;
    }
</script>

</body>
</html>
