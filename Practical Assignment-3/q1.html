<!DOCTYPE html>
<html>
<body>

<script>
    let num = parseInt(prompt("Enter a number:"));
    let evenCount = 0;
    let oddCount = 0;

    while (num > 0) {
        let digit = num % 10;

        if (digit % 2 === 0) {
            evenCount++;
        } else {
            oddCount++;
        }

        num = Math.floor(num / 10);
    }

    alert("Even digits: " + evenCount + "\nOdd digits: " + oddCount);
</script>

</body>
</html>
