<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remove Duplicates from Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        p {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h3>Remove Duplicates</h3>

    <input type="text" id="arrayInput" placeholder="Enter values (e.g. 1,2,2,3,4,4)">
    <button onclick="removeDuplicates()">Remove</button>

    <p id="result"></p>
</div>

<script>
    function removeDuplicates() {
        let input = document.getElementById("arrayInput").value;

        let arr = input.split(",").map(item => item.trim());

        let uniqueArray = [...new Set(arr)];

        document.getElementById("result").innerHTML =
            "Unique Array: [" + uniqueArray.join(", ") + "]";
    }
</script>

</body>
</html>
